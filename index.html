<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let currentDocMode = 'pdf2word'; 
    let originalDocName = "dokumen";

    function switchTool(index) {
        const panels = document.querySelectorAll('.tool-panel');
        const buttons = document.querySelectorAll('.menu-btn');
        panels.forEach(panel => panel.classList.remove('active'));
        buttons.forEach(btn => btn.classList.remove('active'));
        panels[index].classList.add('active');
        buttons[index].classList.add('active');
    }

    function setDocMode(mode) {
        currentDocMode = mode;
        document.getElementById('btnPdfToWord').classList.toggle('active', mode === 'pdf2word');
        document.getElementById('btnWordToPdf').classList.toggle('active', mode === 'word2pdf');
        document.getElementById('docInput').accept = mode === 'pdf2word' ? ".pdf" : ".docx";
        document.getElementById('docDownloadArea').innerHTML = '';
        document.getElementById('statusDoc').innerText = '';
        
        const warning = document.getElementById('pdfWarning');
        if(mode === 'pdf2word'){
            warning.innerHTML = "<b>PENTING:</b> Ini web murni. Konversi ke Word HANYA mengambil Teks. Tabel, Gambar & Desain PASTI HILANG.";
        } else {
            warning.innerHTML = "<b>PENTING:</b> Dokumen panjang mungkin butuh waktu lama di HP. Harap tunggu hingga selesai.";
        }
    }

    async function processDocument() {
        const fileInput = document.getElementById('docInput');
        const statusMsg = document.getElementById('statusDoc');
        const downloadArea = document.getElementById('docDownloadArea');
        
        if (fileInput.files.length === 0) return;
        const file = fileInput.files[0];
        originalDocName = file.name.replace(/\.[^/.]+$/, "");
        downloadArea.innerHTML = "";

        if (currentDocMode === 'pdf2word') {
            statusMsg.innerText = "Membaca halaman PDF... (Jangan tutup halaman ini)";
            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                let fullHtml = "";

                // Ekstrak per halaman dengan jeda agar HP tidak lag/crash
                for (let i = 1; i <= pdf.numPages; i++) {
                    statusMsg.innerText = `Ekstrak Teks: Halaman ${i} dari ${pdf.numPages}...`;
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    
                    let textLines = "";
                    textContent.items.forEach(function (item) {
                        textLines += item.str + " ";
                    });
                    
                    fullHtml += `<div class="Section1"><p class='MsoNormal'>${textLines}</p></div><br clear="all" style="page-break-before:always" />`;
                }

                const docContent = `
                    <html xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
                    <head><meta charset="utf-8"><style>
                        @page Section1 { size: 595.3pt 841.9pt; margin: 1in; }
                        div.Section1 { page: Section1; }
                        p.MsoNormal { margin-bottom: 10pt; font-size: 12.0pt; font-family: "Times New Roman", serif; }
                    </style></head>
                    <body>${fullHtml}</body>
                    </html>
                `;

                const blob = new Blob(['\ufeff' + docContent], { type: 'application/msword' });
                const url = URL.createObjectURL(blob);
                
                statusMsg.innerText = `Sukses! ${pdf.numPages} Halaman diekstrak (Tanpa Gambar/Tabel).`;
                downloadArea.innerHTML = `<a href="${url}" download="${originalDocName}-hasil.doc" class="action-btn">📥 Unduh ke Word (.doc)</a>`;
            } catch (error) {
                console.error(error);
                statusMsg.innerText = "Gagal. File terlalu besar atau terkunci.";
            }
        } else {
            // PROSES WORD TO PDF (Diperbaiki agar tidak terpotong 1 halaman)
            statusMsg.innerText = "Mengubah struktur Word ke HTML...";
            try {
                const arrayBuffer = await file.arrayBuffer();
                const result = await mammoth.convertToHtml({ arrayBuffer: arrayBuffer });
                
                if (!result.value.trim()) {
                    statusMsg.innerText = "Gagal: Dokumen kosong / format tidak didukung.";
                    return;
                }

                statusMsg.innerText = "Membentuk PDF... (Sedang memproses halaman)";

                // Kita masukkan hasil HTML ke dalam kerangka dokumen maya (tidak di layar)
                const htmlString = `
                    <div style="padding: 20mm; font-family: 'Times New Roman', serif; font-size: 12pt; line-height: 1.5; color: black; background: white; text-align: justify;">
                        ${result.value}
                    </div>
                `;

                const opt = {
                    margin:       [10, 10, 10, 10],
                    filename:     originalDocName + '-hasil.pdf',
                    image:        { type: 'jpeg', quality: 0.98 },
                    html2canvas:  { scale: 2, useCORS: true }, 
                    jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };

                // html2pdf kini memproses langsung dari STRING, bukan dari elemen yang tersembunyi di layar HP
                html2pdf().set(opt).from(htmlString).save().then(() => {
                    statusMsg.innerText = "Berhasil! PDF telah diunduh.";
                    downloadArea.innerHTML = `<p style="color:yellow; font-size:12px; margin-top:10px;">Cek folder Download Anda.</p>`;
                }).catch(err => {
                    statusMsg.innerText = "Memori HP tidak kuat merender PDF ini.";
                });

            } catch (error) {
                console.error(error);
                statusMsg.innerText = "Error: Format Word tidak kompatibel (Gunakan file .docx biasa).";
            }
        }
    }
</script>
